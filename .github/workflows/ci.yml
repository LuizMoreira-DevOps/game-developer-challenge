name: Quality

on:
    pull_request:
        branches:
            - main
    push:
        branches:
            - main

permissions:
    contents: read

concurrency:
    group: quality-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    quality:
        name: Quality
        runs-on: ubuntu-24.04
        timeout-minutes: 15

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Type check
              run: npm run typecheck

            - name: Build
              run: npm run build

            - name: Install Playwright Chromium
              run: npx playwright install --with-deps chromium

            - name: Run end-to-end smoke tests
              run: npm run test:e2e

            - name: Smoke test production preview
              shell: bash
              run: |
                  npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/pirate-battle-preview.log 2>&1 &

                  for attempt in {1..20}; do
                      if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
                          echo "Production preview responded successfully."
                          exit 0
                      fi

                      sleep 1
                  done

                  echo "Production preview failed to respond."
                  cat /tmp/pirate-battle-preview.log
                  exit 1
