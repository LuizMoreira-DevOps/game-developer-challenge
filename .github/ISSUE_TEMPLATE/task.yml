name: Task
description: Plan a unit of work for Pirate Battle

body:
    - type: textarea
      id: objective
      attributes:
          label: Objective
          description: What should be achieved?
      validations:
          required: true

    - type: textarea
      id: context
      attributes:
          label: Context
          description: Why does this task exist?
      validations:
          required: true

    - type: textarea
      id: scope
      attributes:
          label: Scope
          description: What is included in this task?
      validations:
          required: true

    - type: textarea
      id: out-of-scope
      attributes:
          label: Out of scope
          description: What is intentionally not included?

    - type: textarea
      id: acceptance
      attributes:
          label: Acceptance criteria
          description: How will we know this task is complete?
      validations:
          required: true
