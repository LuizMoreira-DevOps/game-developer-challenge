name: Bug
description: Report an incorrect behavior
title: "[Bug] "
labels:
    - "bug"
body:
    - type: textarea
      id: problem
      attributes:
          label: Problem
          description: What is happening?
      validations:
          required: true

    - type: textarea
      id: expected
      attributes:
          label: Expected behavior
          description: What should happen instead?
      validations:
          required: true

    - type: textarea
      id: reproduction
      attributes:
          label: Steps to reproduce
          description: Provide the minimum steps required to reproduce the problem.

    - type: textarea
      id: evidence
      attributes:
          label: Evidence
          description: Logs, screenshots, errors or any other useful information.

    - type: textarea
      id: acceptance
      attributes:
          label: Acceptance criteria
          description: What must be true for this bug to be considered fixed?
      validations:
          required: true
